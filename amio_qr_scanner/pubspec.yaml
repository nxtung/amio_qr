name: amio_qr_scanner
description: Native QR code scanner plugin for AMIO and DGX projects (CameraX + ML Kit on Android, AVFoundation + Vision on iOS).
version: 1.0.0
homepage: https://amio.vn

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: vn.com.dgx.amio_qr_scanner
        pluginClass: AmioQrScannerPlugin
      ios:
        pluginClass: AmioQrScannerPlugin
